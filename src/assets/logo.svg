<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Vibrant Blue Gradient -->
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- Outer Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Circular Outer Seal / Background -->
  <circle cx="100" cy="100" r="88" fill="url(#blueGradient)" filter="url(#glow)" />

  <!-- Clean Stylized "A" Block -->
  <path d="M 60 45 
           H 140 
           A 12 12 0 0 1 152 57 
           V 143 
           A 12 12 0 0 1 140 155 
           H 118 
           A 6 6 0 0 1 112 149 
           V 115 
           A 12 12 0 0 0 88 115 
           V 149 
           A 6 6 0 0 1 82 155 
           H 60 
           A 12 12 0 0 1 48 143 
           V 57 
           A 12 12 0 0 1 60 45 Z" 
        fill="#FFFFFF" />

  <!-- Upper Inner Cutout of "A" -->
  <rect x="91" y="68" width="18" height="30" rx="9" fill="url(#blueGradient)" />
</svg>
